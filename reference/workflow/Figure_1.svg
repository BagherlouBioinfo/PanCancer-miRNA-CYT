    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(256.969132 286.881589)">Feature and cluster survival</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(240.653233 297.152537)">Mediation · Clustering · miR-146a/b</text>
