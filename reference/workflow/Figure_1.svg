   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #223443" x="165.857143" y="29.800334" transform="rotate(-0 165.857143 29.800334)">Matched TCGA cohort</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(75.310643 41.050261)">9,286 primary tumours · 31 cancer types</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(76.626518 51.439266)">Matched miRNA, mRNA and clinical data</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #223443" x="165.857143" y="81.345788" transform="rotate(-0 165.857143 81.345788)">Within-cancer discovery and TargetScan integration</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(82.398768 92.595716)">miRNA–CYT · miRNA–gene · gene–CYT</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(56.156893 102.984721)">Primary CPE analysis: 7,523 tumours · 20 cancers</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(108.64408 139.610045)">All three arms: |ρ| ≥ 0.30,</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(87.640268 149.842602)">BH-FDR &lt; 0.05 in the same cancer,</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(97.27558 159.83041)">with recurrence in ≥3 cancers?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(354.976911 144.77394)">Not in the</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(351.371661 154.628015)">primary set</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #223443" x="165.857143" y="204.073061" transform="rotate(-0 165.857143 204.073061)">Fixed primary association set</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(98.013268 215.322989)">47 pairs · 6 miRNAs · 40 genes</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(89.753643 225.711994)">315 qualifying pair–cancer records</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #223443" x="114.428571" y="265.436697" transform="rotate(-0 114.428571 265.436697)">Sensitivity and specificity testing</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(64.9514 276.610641)">LUMP purity sensitivity</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(45.640798 286.881589)">Immune-population adjustment</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #223443" transform="translate(26.600712 297.152537)">Correlation-matched non-target controls</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #223443" x="317.571429" y="265.436697" transform="rotate(-0 317.571429 265.436697)">Pooled and exploratory analyses</text>
   </g>
   <g id="text_12">
